{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Create an account</h2>
    <p class="sub">It only takes a minute</p>
    <form method="post" class="form" novalidate>{% csrf_token %}
      {{ form.as_p }}
      <button class="btn">Create account</button>
    </form>
    <p class="switch">Already registered? <a href="{% url 'login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
