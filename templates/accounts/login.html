{% extends "base_guest.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to your account</p>
    <form method="post" action="{% url 'login' %}" class="form" novalidate>
      {% csrf_token %}
      <p><label>Email</label><input name="identifier" required autofocus></p>
      <p><label>Master Password</label><input name="password" type="password" required></p>
      <button class="btn btn-block">Log in</button>
    </form>
    <p class="switch">No account? <a href="{% url 'register' %}">Register</a></p>
  </div>
</div>
{% endblock %}
