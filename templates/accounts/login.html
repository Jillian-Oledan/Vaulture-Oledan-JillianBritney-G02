{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
  <div class="w-full max-w-sm p-6 bg-white rounded-lg shadow-md border border-gray-100">
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <input name="username" placeholder="Username" required
        class="w-full px-4 py-2.5 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      <input name="password" type="password" placeholder="Password" required
        class="w-full px-4 py-2.5 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      <button type="submit"
        class="w-full py-2.5 rounded-md bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition">
        Log in
      </button>
    </form>
  </div>
</div>
{% endblock %}
