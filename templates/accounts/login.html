{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to your account</p>
    <form method="post" class="form">{% csrf_token %}
      <p><label>Username</label><input name="username" required autofocus></p>
      <p><label>Password</label><input name="password" type="password" required></p>
      <button class="btn">Log in</button>
    </form>
    <p class="switch">No account? <a href="{% url 'register' %}">Register</a></p>
  </div>
</div>
{% endblock %}
