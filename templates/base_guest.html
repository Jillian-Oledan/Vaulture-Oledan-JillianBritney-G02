{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vaulture{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="guest">
  <a class="guest-logo" href="/">Vaulture</a>
  {% if messages %}
    {% for m in messages %}<div class="alert {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% endif %}
  <div class="auth-wrap">{% block content %}{% endblock %}</div>
</div>
</body>
</html>
